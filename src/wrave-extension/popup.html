<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wrave MCP Server</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="brand">
        <img src="icons/product_logo_32.png" alt="Wrave Mascot" class="brand-icon">
        <div class="brand-info">
          <div class="brand-title">Wrave MCP Server</div>
          <div class="brand-sub">Browser Automation Bridge</div>
        </div>
      </div>
      <div class="status-badge" id="statusBadge">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-text" id="statusText">Checking</span>
      </div>
    </header>

    <div class="card">
      <div class="card-header">
        <span class="card-title">Connection Status</span>
        <button class="btn-sm" id="refreshBtn">Refresh</button>
      </div>
      <div class="info-row">
        <span class="info-label">Bridge Status</span>
        <span class="info-val" id="bridgeVal">Checking...</span>
      </div>
      <div class="info-row">
        <span class="info-label">MCP Port</span>
        <span class="info-val" id="mcpPortVal">:8282</span>
      </div>
      <div class="info-row">
        <span class="info-label">CDP Port</span>
        <span class="info-val" id="cdpPortVal">:9222</span>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-title">MCP Client Setup</span>
        <button class="btn-sm" id="copyBtn">Copy</button>
      </div>
      <div class="code-box" id="mcpCode">node "C:\Users\walid\Desktop\weed\wrave\src\wrave-engine\cli.js" --stdio</div>
    </div>

    <div class="actions">
      <button class="btn btn-secondary" id="openSettingsBtn">Settings</button>
      <button class="btn btn-primary" id="reconnectBtn">Reconnect</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
